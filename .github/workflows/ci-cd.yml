name: CI-CD Pipeline
 
on:
  push:
    branches: [ "main" ]
 
jobs:
  build-scan-deploy:
    runs-on: ubuntu-latest
 
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
 
    - name: Build Docker image
      run: docker build -t runner-game .
 
    - name: Scan image with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: runner-game
        format: table
        exit-code: "0"
        ignore-unfixed: true
        vuln-type: "os,library"
        severity: "CRITICAL,HIGH"
 
    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
 
    - name: Push image to Docker Hub
      run: |
        docker tag runner-game ${{ secrets.DOCKER_USERNAME }}/runner-game:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/runner-game:latest
 
    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_IP }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/runner-game:latest
          docker stop game || true
          docker rm game || true
          docker run -d --name game -p 80:80 ${{ secrets.DOCKER_USERNAME }}/runner-game:latest
